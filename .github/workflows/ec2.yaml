name: Terraform CI-CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.8"
  AWS_REGION: "us-east-1"

jobs:

  terraform:
    name: Terraform Security + Deploy + Destroy
    runs-on: terraform

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Terraform
      # --------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # --------------------------------------------------
      # 3. Configure AWS using GitHub OIDC
      # --------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::571573792013:role/github-actions-terraform-role


      # --------------------------------------------------
      # 4. Verify AWS
      # --------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------
      # 5. Terraform Format
      # --------------------------------------------------

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive


      # --------------------------------------------------
      # 6. Terraform Init
      # --------------------------------------------------

      - name: Terraform Init
        run: |
          terraform init -input=false


      # --------------------------------------------------
      # 7. Terraform Validate
      # --------------------------------------------------

      - name: Terraform Validate
        run: |
          terraform validate


      # --------------------------------------------------
      # 8. Install Checkov
      # --------------------------------------------------

      - name: Install Checkov
        run: |
          python3 -m pip install --upgrade pip
          pip3 install checkov


      # --------------------------------------------------
      # 9. Checkov Terraform source scan
      # --------------------------------------------------

      - name: Checkov IaC Security Scan
        run: |
          checkov -d . \
            --framework terraform \
            --download-external-modules true


      # --------------------------------------------------
      # 10. Terraform Plan
      # --------------------------------------------------

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -out=tfplan


      # --------------------------------------------------
      # 11. Convert Terraform plan to JSON
      # --------------------------------------------------

      - name: Terraform Plan JSON
        run: |
          terraform show -json tfplan > tfplan.json


      # --------------------------------------------------
      # 12. Checkov Terraform PLAN scan
      # --------------------------------------------------

      - name: Checkov Terraform Plan Scan
        run: |
          checkov -f tfplan.json


      # --------------------------------------------------
      # 13. Terraform Apply
      # --------------------------------------------------

      - name: Terraform Apply
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan


      # --------------------------------------------------
      # 14. Wait 30 seconds
      # --------------------------------------------------

      - name: Wait 30 seconds
        run: |
          echo "Waiting 30 seconds..."
          sleep 30


      # --------------------------------------------------
      # 15. Terraform Destroy
      # --------------------------------------------------

      - name: Terraform Destroy
        if: always()
        run: |
          terraform destroy \
            -input=false \
            -auto-approve