name: "Terraform CI/CD"

on:
  push:
    branches:
      - main # Production
      - dev # Development
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.3"

jobs:
  terraform-plan:
    name: "Terraform Plan"
    runs-on: self-hosted
    outputs:
      environment: ${{ steps.env-vars.outputs.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3