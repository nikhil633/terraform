name: "Terraform CI/CD"

on:
  push:
    branches:
      - main # Production
      - dev # Development
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.3"

jobs:
  terraform-plan:
    name: "Terraform Plan"
    runs-on: self-hosted
    outputs:
      environment: ${{ steps.env-vars.outputs.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Determine Environment
        id: env-vars
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH_NAME="${{ github.base_ref }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
          fi

          if [[ "$BRANCH_NAME" == "main" ]]; then
            ENVIRONMENT="prod"
          else
            ENVIRONMENT="dev"
          fi

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_ENV"

          echo "Deploying to: $ENVIRONMENT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::571573792013:role/github-actions-terraform-role

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./aws/s3
        run: |
          # Initialize with environment-specific backend configuration
          terraform init -reconfigure -backend-config="backend-${{ env.ENVIRONMENT }}.hcl"

      - name: Terraform Format Check
        working-directory: ./aws/s3
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Validate
        working-directory: ./aws/s3
        id: validate
        run: terraform validate

      

      - name: Terraform Plan
        working-directory: ./aws/s3
        id: plan
        run: |
          terraform plan -no-color -out=tfplan | tee plan_output.txt
        continue-on-error: true

      - name: Check Plan Files
        run: |
          pwd
          ls -la
          find . -name "plan_output.txt" -o -name "tfplan"

      
      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.TOKEN }}
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('aws/s3/plan_output.txt', 'utf8');

            const output = `#### Terraform Plan for \`${{ env.ENVIRONMENT }}\` Environment 🌍

            <details>
            <summary>Show Plan</summary>

            \`\`\`terraform
            ${planOutput.slice(0, 60000)}
            \`\`\`

            </details>

            - **Format:** \`${{ steps.fmt.outcome }}\`
            - **Validate:** \`${{ steps.validate.outcome }}\`
            - **Plan:** \`${{ steps.plan.outcome }}\`

            *Pushed by: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1


      - name: Upload Plan
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.ENVIRONMENT }}
          path: aws/s3/tfplan
          retention-days: 5
          if-no-files-found: warn


  terraform-apply:
    name: "Terraform Apply"
    needs: terraform-plan
    if: github.event_name == 'push' && needs.terraform-plan.result == 'success'
    runs-on: self-hosted
   # environment: ${{ needs.terraform-plan.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Determine Environment
        id: env-vars
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          if [[ "$BRANCH_NAME" == "main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::571573792013:role/github-actions-terraform-role

      - name: Terraform Init
        working-directory: ./aws/s3
        run: |
          # Initialize with environment-specific backend configuration
          terraform init -reconfigure -backend-config="backend-${{ env.ENVIRONMENT }}.hcl"

      - name: Download Plan
        uses: actions/download-artifact@v4
        continue-on-error: true
        id: download
        with:
          name: tfplan-${{ env.ENVIRONMENT }}
          path: aws/s3

      - name: Check if Plan Exists
        working-directory: ./aws/s3
        id: check-plan
        run: |
          if [ -f "tfplan" ]; then
            echo "plan_exists=true" >> $GITHUB_OUTPUT
          else
            echo "plan_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No plan file found - infrastructure may already be up to date"
          fi

      - name: Terraform Apply
        working-directory: ./aws/s3
        if: steps.check-plan.outputs.plan_exists == 'true'
        run: |
          echo "Applying Terraform changes for $ENVIRONMENT environment..."
          terraform apply -auto-approve tfplan

      - name: No Changes to Apply
        if: steps.check-plan.outputs.plan_exists == 'false'
        run: |
          echo "### ℹ️ No Changes to Apply" >> $GITHUB_STEP_SUMMARY
          echo "Infrastructure is already up to date. No plan file was generated." >> $GITHUB_STEP_SUMMARY

      - name: Output Infrastructure Info
        if: steps.check-plan.outputs.plan_exists == 'true'
        run: |
          echo "### 🚀 Infrastructure Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          terraform output >> $GITHUB_STEP_SUMMARY

      - name: Wait 30 seconds
        run: |
          echo "Waiting 30 seconds..."
          sleep 30

      - name: Terraform Destroy
        working-directory: ./aws/s3
        if: always()
        run: |
          terraform destroy \
            -input=false \
            -auto-approve